[package]
name = "rcgen"
version = "0.12.0"
documentation = "https://docs.rs/rcgen"
description.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
edition.workspace = true
keywords.workspace = true

[[example]]
name = "rsa-irc"
required-features = ["pem"]

[[example]]
name = "rsa-irc-openssl"
required-features = ["pem"]

[[example]]
name = "sign-leaf-with-ca"
required-features = ["pem", "x509-parser"]

[dependencies]
yasna = { version = "0.5.2", features = ["time", "std"] }
pem = { workspace = true, optional = true }
time = { version = "0.3.6", default-features = false }
x509-parser = { version = "0.15", features = ["verify"], optional = true }
zeroize = { version = "1.2", optional = true }

[dependencies.ring]
git = "https://github.com/Pencil-Yao/ring"
branch = "231205-smx"

[features]
default = ["pem"]

[package.metadata.docs.rs]
features = ["x509-parser"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "time::offset_date_time::OffsetDateTime",
    "zeroize::Zeroize"
]

[dev-dependencies]
openssl = "0.10"
x509-parser = { version = "0.15", features = ["verify"] }
botan = { version = "0.10", features = ["vendored"] }
rand = "0.8"
rsa = "0.9"

[dependencies.rustls-webpki]
git = "https://github.com/Pencil-Yao/webpki"
branch = "231205-smx"
features = ["std"]
